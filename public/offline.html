<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KROWD — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #E6F4D7;
        color: #1A211C;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        padding: 24px;
      }
      .card {
        max-width: 400px;
        background: #FFFFFF;
        border: 1px solid #D1E7BD;
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 10px 30px rgba(40, 60, 30, 0.08);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
        color: #1A211C;
      }
      p {
        margin: 0 0 20px;
        color: #627065;
        font-size: 14px;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 12px;
        background: #121814;
        color: #FFFFFF;
        padding: 12px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are currently offline</h1>
      <p>
        Live crowd observations, weather updates, and map tiles require an active connection. Reconnect to view current Bengaluru conditions.
      </p>
      <button onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
